<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Currency Exchange</title>
    <meta
      name="description"
      content="Convert between Indonesian Rupiah, US Dollar and Tunisian Dinar at live exchange rates."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <main class="card">
      <header class="card__header">
        <div>
          <h1 class="card__title">Currency Exchange</h1>
          <p class="card__subtitle">Type in any currency — the rest follow.</p>
        </div>

        <button class="refresh" id="refresh" type="button" aria-label="Refresh rates">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <path d="M20 4v4.5h-4.5" />
          </svg>
        </button>
      </header>

      <div class="rows" id="rows"></div>

      <p class="error" id="amount-error" role="alert" hidden>Enter a valid amount.</p>

      <footer class="card__footer">
        <p class="status" id="status" data-tone="loading" aria-live="polite">Loading rates…</p>
        <p class="status__detail" id="status-detail"></p>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
