<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Currency Exchange</title>
    <meta
      name="description"
      content="Convert between Indonesian Rupiah, US Dollar and Tunisian Dinar at live exchange rates."
    />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>

  <body>
    <main class="card">
      <header class="card__header">
        <h1 class="card__title">Currency Exchange</h1>
        <p class="card__subtitle">Type in any currency to see the others.</p>
      </header>

      <div class="rows" id="rows"></div>

      <p class="field__error" id="amount-error" role="alert" hidden>
        Enter a valid amount.
      </p>

      <p class="rate" id="rate" aria-live="polite">Loading rates…</p>

      <footer class="card__footer">
        <p class="status" id="status">Connecting…</p>
        <button class="refresh" id="refresh" type="button">Refresh</button>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
